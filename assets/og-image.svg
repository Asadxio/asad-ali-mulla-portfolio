<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="65%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#c6a15b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050806" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#b38636"/>
    </linearGradient>
  </defs>

  <!-- Deep Cyber Obsidian Background -->
  <rect width="1200" height="630" fill="#060907"/>

  <!-- Radial Glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle Grid lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Border Frame -->
  <rect x="36" y="36" width="1128" height="558" rx="12" fill="none" stroke="rgba(198, 161, 91, 0.35)" stroke-width="1.5"/>

  <!-- Brand Mark -->
  <g transform="translate(90, 90)">
    <circle cx="36" cy="36" r="36" fill="#0b3d2e" stroke="#10b981" stroke-width="2"/>
    <text x="22" y="49" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#f4f2ec">A</text>
    <circle cx="50" cy="50" r="4.5" fill="#e5b869"/>
    <text x="96" y="32" font-family="'Courier New', monospace" font-size="16" letter-spacing="4" fill="#a3b5a7">ASAD ALI MULLA</text>
    <text x="96" y="52" font-family="'Courier New', monospace" font-size="12" letter-spacing="2" fill="#e5b869">PORTFOLIO // 2026</text>
  </g>

  <!-- Headline -->
  <text x="90" y="270" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#f1f5f2" letter-spacing="-1">
    Turning ideas into <tspan fill="url(#gold-grad)">useful</tspan>
  </text>
  <text x="90" y="340" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#f1f5f2" letter-spacing="-1">
    digital reality.
  </text>

  <!-- Subtitle -->
  <text x="90" y="415" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#a3b5a7">
    Data Analytics · Machine Learning · AI Applications · Digital Products
  </text>

  <!-- Tags / Chips -->
  <g transform="translate(90, 475)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="110" height="38" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1"/>
    <text x="18" y="24" font-family="monospace" font-size="14" fill="#34d399">Python</text>

    <!-- Tag 2 -->
    <rect x="126" y="0" width="118" height="38" rx="6" fill="rgba(229, 184, 105, 0.12)" stroke="#e5b869" stroke-width="1"/>
    <text x="144" y="24" font-family="monospace" font-size="14" fill="#fcd34d">Power BI</text>

    <!-- Tag 3 -->
    <rect x="260" y="0" width="160" height="38" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <text x="278" y="24" font-family="monospace" font-size="14" fill="#f1f5f2">Deep Learning</text>

    <!-- Tag 4 -->
    <rect x="436" y="0" width="170" height="38" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1"/>
    <text x="454" y="24" font-family="monospace" font-size="14" fill="#34d399">Computer Vision</text>

    <!-- Tag 5 -->
    <rect x="622" y="0" width="150" height="38" rx="6" fill="rgba(229, 184, 105, 0.12)" stroke="#e5b869" stroke-width="1"/>
    <text x="640" y="24" font-family="monospace" font-size="14" fill="#fcd34d">Full-Stack Web</text>
  </g>

  <!-- Live Link right pill -->
  <g transform="translate(900, 475)">
    <rect x="0" y="0" width="210" height="42" rx="21" fill="#0b3d2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="32" y="26" font-family="monospace" font-size="15" font-weight="bold" fill="#f4f2ec">asad.myoss.in ↗</text>
  </g>
</svg>
